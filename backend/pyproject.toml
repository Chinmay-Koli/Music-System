[project]
name = "deluxe-saloon-api"
version = "0.1.0"
description = "Retro Hindi music discovery backend"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Deluxe Saloon Team" }]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
src = ["app"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.alembic]
script_location = "alembic"
