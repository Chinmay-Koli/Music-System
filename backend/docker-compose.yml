version: "3.9"

services:
  api:
    build:
      context: .
    container_name: retro_mehfil_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/retro_mehfil
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: change-this-value
      ENVIRONMENT: development
      DEBUG: "true"
    depends_on:
      - db
      - redis
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  db:
    image: postgres:16-alpine
    container_name: retro_mehfil_db
    environment:
      POSTGRES_DB: retro_mehfil
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: retro_mehfil_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
